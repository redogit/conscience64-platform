<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><meta name="description" content="A quiet workspace for finding, keeping and connecting your work."><title>Conscience64 · Your workspace</title><link rel="stylesheet" href="workspace/style.css"></head>
<body><canvas id="scene" aria-hidden="true"></canvas><a class="skip" href="#question">Skip to your question</a>
<header><a class="brand" href="https://redogit.github.io/redogit/">Conscience<span>64</span></a><span id="runtime">Starting the workspace…</span></header>
<nav aria-label="Workspace"><button class="edge recent" data-drawer="recent" aria-expanded="false" aria-controls="drawer">Recent <span>↶</span></button><button class="edge add" data-drawer="add" aria-expanded="false" aria-controls="drawer">Add <span>＋</span></button><button class="edge refine" data-drawer="refine" aria-expanded="false" aria-controls="drawer">Refine <span>≋</span></button><button class="edge tools" data-drawer="tools" aria-expanded="false" aria-controls="drawer">Tools <span>⋯</span></button></nav>
<main id="main"><section id="welcome"><p class="eyebrow">A little space to think.</p><h1>What would you like<br>help finding?</h1><p class="intro">Your notes. A useful source. Where you left off.</p><div class="examples"><button data-query="What have I saved?">Explore my library</button><button data-drawer="add">Keep a thought</button></div></section><section id="results" hidden aria-label="Search results"><div class="results-head"><h1 id="result-title"></h1><button id="clear" aria-label="Return to start">✕</button></div><p id="summary" role="status"></p><div id="cards"></div><div id="pagination"><button id="prev">Previous</button><span id="page"></span><button id="next">Next</button></div></section></main>
