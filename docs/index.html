<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><meta name="description" content="Conscience64 Space Lens: build a question, choose context and search records and the web in one adaptive view."><title>Conscience64 · Space Lens</title><link rel="stylesheet" href="workspace/style.css"></head>
<body data-view="welcome"><a class="skip" href="#question">Skip to search</a>
<header><a class="brand" href="https://redogit.github.io/redogit/">Conscience<span>64</span></a><span id="runtime">Opening Space Lens…</span></header>
<nav aria-label="Workspace"><button class="edge recent" data-drawer="recent" aria-expanded="false" aria-controls="drawer">Recent</button><button class="edge add" data-drawer="add" aria-expanded="false" aria-controls="drawer">Library</button><button class="edge refine" data-drawer="refine" aria-expanded="false" aria-controls="drawer">Sources</button><button class="edge tools" data-drawer="tools" aria-expanded="false" aria-controls="drawer">Tools</button><button id="reset" type="button" aria-label="Reset view">Reset</button></nav>
<main id="main" aria-label="Space Lens"><canvas id="scene" aria-hidden="true"></canvas><div class="scene-vignette" aria-hidden="true"></div><section id="welcome"><div class="space-core"><strong>SPACE LENS</strong><span>Type · choose · refine · search</span></div></section><section id="results" hidden aria-label="Search results"><div class="results-head"><h1 id="result-title"></h1><button id="clear" aria-label="Reset search">✕</button></div><p id="summary" role="status"></p><div id="cards"></div><div id="pagination"><button id="prev">Previous</button><span id="page"></span><button id="next">Next</button></div></section></main>
<aside id="drawer" hidden aria-labelledby="drawer-title" role="dialog" aria-modal="true"><div class="drawer-head"><h2 id="drawer-title"></h2><button id="close" aria-label="Close menu">✕</button></div><div id="drawer-body"></div><div id="drawer-pagination"><button id="drawer-prev">Previous</button><span id="drawer-page" role="status"></span><button id="drawer-next">Next</button></div></aside>
<section class="composer" aria-label="Inline search builder"><form id="ask" role="search"><label class="sr" for="question">What are you looking for?</label><div id="word-chain" aria-label="Chosen words"></div><input id="question" type="text" placeholder="What are you looking for?" autocomplete="off" maxlength="2000" aria-describedby="proposal-status"><button id="voice" type="button" aria-label="Dictate your question">◉</button><button id="submit" aria-label="Search library" disabled>Search</button></form>
<div class="builder-row"><div id="accepted-context" aria-label="Accepted search context"></div><div id="context-proposals" aria-label="Word completions and optional details"></div></div><p id="proposal-status" role="status" aria-live="polite"></p>
<div class="context-line"><span id="query-subject">Choose a word or type freely.</span><button id="external-search" type="button" disabled>Search the web ↗</button></div>
<div class="composer-foot"><button id="alignment" data-drawer="refine">Sources</button><span id="notice" role="status" aria-live="polite"></span></div><p id="context" class="sr" aria-live="polite"></p></section>
<noscript><p class="nojs">Enable JavaScript to use Space Lens. <a href="previous.html">Project information</a>.</p></noscript><script type="module" src="workspace/bootstrap.mjs"></script></body></html>
