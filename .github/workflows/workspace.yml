name: Workspace checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node docs/workspace/search.test.mjs
      - run: python validate.py --integrity-only
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory docs > /tmp/workspace-server.log 2>&1 &
          node tests/workspace-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-previews
          path: '*-preview.png'
